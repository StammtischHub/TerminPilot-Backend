spring:
  datasource:
    url: jdbc:mysql://localhost:${DOCKER_MYSQL_PORT}/${DOCKER_DB_NAME}
    username: ${DOCKER_DB_USER}
    password: ${DOCKER_DB_USER_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
