spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${LOCAL_DB_NAME}
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_USER_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

google:
  calendar:
    credentials-path: classpath:google-credentials.json
    id: ${GOOGLE_CALENDAR_ID:}

terminpilot:
  encryption:
    key: ${TERMINPILOT_ENCRYPTION_KEY}
  apple-caldav:
    base-url: https://caldav.icloud.com
    connect-timeout: PT10S
    read-timeout: PT30S
  calendar-sync:
    lookahead-days: 180
