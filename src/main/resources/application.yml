spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: TerminPilot
  jpa:
    open-in-view: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false   # for dev false; on prod true for https

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger.html
  api-docs:
    version: openapi_3_0
    enabled: false

logging:
  level:
    root: INFO
