spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: TerminPilot
  jpa:
    open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

terminpilot:
  encryption:
    key: ${TERMINPILOT_ENCRYPTION_KEY}
  apple-caldav:
    base-url: https://caldav.icloud.com
    connect-timeout: PT10S
    read-timeout: PT30S
  calendar-sync:
    lookahead-days: 180
