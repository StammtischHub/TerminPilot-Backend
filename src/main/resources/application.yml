spring:
  application:
    name: TerminPilot

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  profiles:
    include: local

server:
  port: 8080

logging:
  level:
    root: INFO