services:
  mysql:
    image: mysql:9.0
    container_name: terminpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-RootPassword}
      MYSQL_DATABASE: TerminPilot
      MYSQL_USER: ${DOCKER_DB_USER:-User}
      MYSQL_PASSWORD: ${DOCKER_DB_USER_PASSWORD:-UserPassword}
    ports:
      - "3366:3306"
    volumes:
      - terminpilot-mysql-data:/var/lib/mysql

volumes:
  terminpilot-mysql-data: