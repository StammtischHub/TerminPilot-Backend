name: CI

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle

      - name: Build project
        run: ./gradlew build -x test -x ktlintCheck

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/classes/
            build/resources/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/download-build

      - name: Run tests
        run: ./gradlew test

  publish-artifact:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: ./.github/actions/download-build

      - name: Upload JAR as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7

  lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gradle

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: publish-artifact
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/download-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release