name: CI

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build project
        run: ./gradlew build -x test

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: terminpilot-backend-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/classes/
            build/resources/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/download-build

      - name: Run tests
        run: ./gradlew test

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
          job_summary: false

  lint:
    name: Lint Kotlin
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Hint on failure
        if: failure()
        run: echo "::warning::Lint failed. Run './gradlew ktlintFormat' locally to auto-fix formatting issues."

      - name: Publish lint results
        uses: lcollins/checkstyle-github-action@v3.2.0
        if: always()
        with:
          path: build/reports/ktlint/**/*.xml