name: CI

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lockfile-check:
    name: Lockfile Check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Validate Lockfile is up to date
        run: |
          ./gradlew dependencies --write-locks > /dev/null
          git diff --exit-code gradle.lockfile

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          image-ref: '.'
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Evaluate Vulnerabilities
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)

          cat trivy-results.json | jq -r '
            .Results[]?.Vulnerabilities[]? |
            "\(.Severity)|\(.PkgName)|\(.InstalledVersion)|\(.FixedVersion // "no fix")|\(.VulnerabilityID)"
          ' | while IFS="|" read -r severity pkg installed fixed cve; do
            case "$severity" in
              CRITICAL) color="\e[35m" ;;  # Magenta
              HIGH)     color="\e[31m" ;;  # rot
              MEDIUM)   color="\e[33m" ;;  # gelb
              LOW)      color="\e[34m" ;;  # blau
            esac
            link="https://nvd.nist.gov/vuln/detail/${cve}"
            echo -e "${color}[${severity}]\e[0m ${pkg}\n\t${installed} -> ${fixed}\n\t${cve} (${link})\n"
          done

          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count vulnerabilities. See report above."
            exit 1
          else
            echo "No vulnerabilities found."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build project
        run: ./gradlew assemble

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: terminpilot-backend-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/classes/
            build/resources/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/download-build

      - name: Run tests
        run: ./gradlew test

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
          job_summary: false

      - name: Publish code coverage
        uses: madrapps/jacoco-report@v1.8.0
        if: |
          always()
          && github.event_name == 'pull_request'
          && !startsWith(github.head_ref, 'renovate')
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: Code Coverage
          update-comment: true

  lint:
    name: Ktlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run ktlint
        if: always()
        run: ./gradlew ktlintCheck || (echo "::warning::Lint failed. Run './gradlew ktlintFormat' to auto-fix formatting issues." && exit 1)

      - name: Publish reports
        uses: lcollins/checkstyle-github-action@v3.2.0
        if: failure()
        with:
          path: build/reports/**/*.xml
