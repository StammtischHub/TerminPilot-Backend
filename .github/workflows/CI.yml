name: CI

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build project
        run: ./gradlew build -x test

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: terminpilot-backend-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/classes/
            build/resources/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/download-build

      - name: Run tests
        run: ./gradlew test

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
          job_summary: false

  lint:
    name: Ktlint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run ktlint
        run: ./gradlew ktlintCheck || (echo "::warning::Lint failed. Run './gradlew ktlintFormat' to auto-fix formatting issues." && exit 1)

      - name: Run detekt
        if: always()
        run: |
          ./gradlew detekt 

      - name: Publish reports
        uses: lcollins/checkstyle-github-action@v3.2.0
        if: always()
        with:
          path: build/reports/**/*.xml

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report-${{ github.sha }}
          path: build/reports/dependency-check-report.html
          retention-days: 1