name: Release
on:
  workflow_dispatch:
    inputs:
      ignore_dependencies_vulnerabilities:
        description: 'Ignore dependency vulnerabilities and proceed with release (not recommended)'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_RELEASE_ACTOR: "StammtischHub Release Bot"

jobs:
  check-permissions:
    name: Check Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and event
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Workflow runs on branch '${{ github.ref_name }}' – only main allowed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Workflow was not triggered manually but by '${{ github.event_name }}' – only workflow_dispatch allowed"
            exit 1
          fi
          echo "✅ Branch is main"

      - name: Check repository role
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            const allowedRoles = ['admin', 'maintain'];

            if (!allowedRoles.includes(perm.permission)) {
              core.setFailed(
                `::error::${context.actor} has role "${perm.permission}" – needs: ${allowedRoles.join(' or ')}`
              );
            }
            console.log(`✅ ${context.actor} is eligible (${perm.permission})`);

  spring_gradle_kotlin:
    name: Spring Gradle Kotlin
    needs:
      - check-permissions
    uses: ./.github/workflows/spring-gradle-kotlin.yml
    with:
      ignore_dependencies_vulnerabilities: ${{ github.event.inputs.ignore_dependencies_vulnerabilities }}

  version_release:
    name: Version Release
    runs-on: ubuntu-latest
    needs:
      - spring_gradle_kotlin
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: ./.github/actions/download-build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ env.GITHUB_RELEASE_ACTOR }}
          GIT_AUTHOR_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "StammtischHub Release Bot"
          GIT_COMMITTER_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
        run: npx semantic-release

  docker_release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: version_release
    permissions:
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    if: needs.version_release.outputs.new_version != ''

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/download-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_RELEASE_ACTOR }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          NEW_VERSION: ${{ needs.version_release.outputs.new_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${OWNER}/terminpilot-backend:${NEW_VERSION} -t ghcr.io/${OWNER}/terminpilot-backend:latest .
          docker push ghcr.io/${OWNER}/terminpilot-backend:${NEW_VERSION}
          docker push ghcr.io/${OWNER}/terminpilot-backend:latest
