name: Release
on:
  workflow_dispatch:

jobs:
  check-permissions:
    name: Check Permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::warning::Workflow runs on branch '${{ github.ref_name }}' – only main allowed"
            exit 1
          fi
          echo "✅ Branch is main"

      - name: Check repository role
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            
            const allowedRoles = ['admin', 'maintain'];
            
            if (!allowedRoles.includes(perm.permission)) {
              core.setFailed(
                `::warning::${context.actor} has role "${perm.permission}" – needs: ${allowedRoles.join(' or ')}`
              );
            }
            console.log(`✅ ${context.actor} is eligible (${perm.permission})`);

  lockfile-check:
    name: Lockfile Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Validate Lockfile is up to date
        run: |
          ./gradlew dependencies --write-locks
          git diff gradle.lockfile
          git diff --exit-code gradle.lockfile

      - name: Update lockfile for renovate
        if: |
          failure()
          && github.event_name == 'pull_request'
          && startsWith(github.head_ref, 'renovate')
          && github.actor == 'renovate[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.lockfile
          git commit -m "chore: update gradle lockfile"
          git push origin HEAD:${{ github.head_ref }}

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: lockfile-check
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          image-ref: '.'
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Evaluate Vulnerabilities
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          
          cat trivy-results.json | jq -r '
            .Results[]?.Vulnerabilities[]? |
            "\(.Severity)|\(.PkgName)|\(.InstalledVersion)|\(.FixedVersion // "no fix")|\(.VulnerabilityID)"
          ' | while IFS="|" read -r severity pkg installed fixed cve; do
            case "$severity" in
              CRITICAL) color="\e[35m" ;;  # Magenta
              HIGH)     color="\e[31m" ;;  # rot
              MEDIUM)   color="\e[33m" ;;  # gelb
              LOW)      color="\e[34m" ;;  # blau
            esac
            link="https://nvd.nist.gov/vuln/detail/${cve}"
            echo -e "${color}[${severity}]\e[0m ${pkg}\n\t${installed} -> ${fixed}\n\t${cve} (${link})"
          done
          
          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count vulnerabilities. See report above."
            exit 1
          else
            echo "No vulnerabilities found."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-permissions
      - dependency-check
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build project
        run: ./gradlew build -x test

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: terminpilot-backend-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/classes/
            build/resources/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - uses: ./.github/actions/download-build

      - name: Run tests
        run: ./gradlew test

  version_release:
    name: Version Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs:
      - build
      - test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: ./.github/actions/download-build

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "StammtischHub Release Bot"
          GIT_AUTHOR_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "StammtischHub Release Bot"
          GIT_COMMITTER_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
        run: npx semantic-release

  docker_release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: version_release
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    if: needs.version_release.outputs.new_version != ''

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/download-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          NEW_VERSION: ${{ needs.version_release.outputs.new_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${OWNER}/terminpilot-backend:${NEW_VERSION} -t ghcr.io/${OWNER}/terminpilot-backend:latest . 
          docker push ghcr.io/${OWNER}/terminpilot-backend:${NEW_VERSION} 
          docker push ghcr.io/${OWNER}/terminpilot-backend:latest